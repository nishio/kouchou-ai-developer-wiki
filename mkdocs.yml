site_name: kouchou-ai developer wiki
site_description: kouchou-ai(広聴AI) 開発者向けナレッジベース
site_url: https://nishio.github.io/kouchou-ai-developer-wiki/
repo_url: https://github.com/nishio/kouchou-ai-developer-wiki
docs_dir: .pages/docs
site_dir: site
theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
